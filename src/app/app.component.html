<ng-container *ngIf="isLoggedIn(); else loginTemplate">
  <app-header></app-header>
  <div class="container">
    <app-sidebar></app-sidebar>
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-footer></app-footer>
</ng-container>

<ng-template #loginTemplate>
  <app-login></app-login>
</ng-template>
