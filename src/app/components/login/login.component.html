<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <span class="logo-text">TimeTableID</span>
      </div>
      <h1>Welcome to Timetable Management System</h1>
      <p>Sign in to access the system</p>
    </div>

    <div class="login-content">
      <div class="login-form">
        <!-- Email/Password Form -->
        <form (ngSubmit)="signInWithEmail()" class="email-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input 
              matInput
              type="email" 
              id="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Enter your email"
              required>
            <!-- <mat-icon matPrefix>email</mat-icon> -->
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input 
              matInput
              type="password" 
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Enter password"
              required>
            <!-- <mat-icon matPrefix>lock</mat-icon> -->
          </mat-form-field>
          
          <button 
            mat-raised-button
            color="primary"
            type="submit" 
            class="login-btn full-width"
            [disabled]="isLoading"
            [class.loading]="isLoading">
            <span class="btn-content">
              <mat-spinner *ngIf="isLoading" diameter="20" class="loading-spinner"></mat-spinner>
              <span class="btn-text">{{ isLoading ? 'Signing in...' : 'Sign In' }}</span>
            </span>
          </button>
        </form>

          <span>or</span>
        </div> -->

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="login-info">
          <h3>Login Guide:</h3>
          <ul>
            <li><strong>Students:</strong> Use email ending with &#64;student.hsu.edu.vn</li>
